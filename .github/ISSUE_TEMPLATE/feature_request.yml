name: ✨ 功能建议 / Feature request
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 先说场景与痛点，再说方案，通常更容易达成共识
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 其他软件是怎么做的
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      options:
        - label: 该功能可以在不引入第三方运行时依赖的前提下实现
          required: false
        - label: 该功能不需要后端服务
          required: false
